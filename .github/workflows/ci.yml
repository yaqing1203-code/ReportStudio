name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          # pip-audit also scans the runner's preinstalled setuptools.
          python -m pip install --upgrade pip "setuptools>=84.1.0"
          pip install -e ".[app,dev]"

      - name: Ruff
        run: ruff check src tests

      - name: Mypy (advisory)
        run: mypy src/core_engine --ignore-missing-imports || true

      - name: Pytest
        run: pytest tests/ -q

      - name: Validate report-quality source snapshots
        run: python -m core_engine.report.quality_eval --mode check

      - name: Deterministic report-quality regression
        run: python -m core_engine.report.quality_eval --mode baseline --output output/quality-ci.json

      - name: Bounded research and inference regression
        run: python -m core_engine.report.research_eval --output output/research-quality-ci.json

      - name: Solid-state battery sparse-evidence regression
        run: python -m core_engine.report.quality_eval --mode baseline --dataset evals/niche_quality/cases.json --output output/quality-niche-ci.json

      - name: Dependency audit
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: pip-audit --local
