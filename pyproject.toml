[project]
name = "core-engine"
version = "0.2.0"
description = "Automated report-generation agent: topic -> authoritative-source scraping -> triple-check verification harness -> formal LaTeX/PDF report."
requires-python = ">=3.11"
dependencies = [
    # --- Config / models (shared) ---
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    # --- Report pipeline: search / scrape ---
    "httpx>=0.27",                 # async HTTP for search API + page fetch
    "trafilatura>=1.8",            # main-content extraction (strips boilerplate)
    # --- Report pipeline: LLM ---
    "anthropic>=0.39",             # claim extraction / entailment / drafting
    # --- Report pipeline: LaTeX rendering ---
    "jinja2>=3.1",                 # template engine (custom delimiters, see latex.py)
]

[project.optional-dependencies]
# Desktop app: chat GUI (pywebview + FastAPI) and the OpenAI-compatible provider.
# Install with `pip install -e ".[app]"` to run `python -m core_engine.app.shell`.
app = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pywebview>=5.0",              # native window over the OS webview (no bundled browser)
    "openai>=1.40",               # optional OpenAI-compatible LLM provider
    "python-multipart>=0.0.9",    # multipart/form-data parsing for document uploads
    # --- Database Mode: user-document parsing (upload -> text) ---
    "pypdf>=4.0",                 # PDF text extraction (pure Python)
    "pymupdf>=1.24",              # PDF fallback for complex layouts (fitz)
    "python-docx>=1.1",           # .docx documents
    "openpyxl>=3.1",              # .xlsx spreadsheets
    "ddgs>=6.0",                  # DuckDuckGo search provider
]
# Building the standalone .exe.
build = [
    "pyinstaller>=6.0",
    "pillow>=10.0",               # render the app icon (packaging/make_icon.py)
]
# The original domain-agnostic data-agent (KG + RAG over Postgres). These modules
# are DORMANT after the pivot to report generation; install this extra only if you
# revive them. See src/core_engine/{stores,retrieval,gateway,ontology,agents}.
data-agent = [
    "psycopg[binary,pool]>=3.2",   # Postgres driver (Apache AGE + pgvector)
    "pgvector>=0.3",
    "sqlalchemy>=2.0",
    "mcp>=1.2",                    # Model Context Protocol SDK
    "fastembed>=0.3",              # local BGE-M3 dense+sparse embeddings
    "jsonschema>=4.21",
    "anyio>=4.0",
]
dev = [
    "pytest>=8.0",
    "anyio>=4.0",                  # async test plugin (pytest.mark.anyio)
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = [
    "BLE001",  # blind-except 是刻意的优雅降级模式（多数带日志）
    "S110",    # try-except-pass：进度回调等 best-effort 场景
    "S112",    # try-except-continue：同上
    "B008",    # FastAPI 习惯用法 UploadFile = File(...)
]

[tool.pytest.ini_options]
# Tests use the anyio pytest plugin (ships with anyio), not pytest-asyncio.
# Async tests are marked with `pytestmark = pytest.mark.anyio`.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core_engine"]

[tool.mypy]
mypy_path = "src"
ignore_missing_imports = true
python_version = "3.11"
